services:
  db:
    image: postgres:15-alpine
    container_name: netpulse-db
    restart: always
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    networks:
      - netpulse-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  scanner:
    build: ./scanner
    container_name: netpulse-scanner
    restart: always
    mem_limit: 256m
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - SCANNER_PORT=${SCANNER_PORT}
      - BACKEND_URL=${BACKEND_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
      - DEBUG=${DEBUG}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: netpulse-backend
    restart: always
    mem_limit: 512m
    network_mode: host
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
      SCANNER_URL: http://localhost:${SCANNER_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: netpulse-frontend
    restart: always
    mem_limit: 256m
    environment:
      - VITE_API_URL=${VITE_API_URL}
    ports:
      - "5173:5173"
    networks:
      - netpulse-net

networks:
  netpulse-net:
    driver: bridge

volumes:
  postgres-data:
