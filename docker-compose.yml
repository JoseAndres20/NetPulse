services:
  db:
    image: postgres:15-alpine
    container_name: netpulse-db
    restart: always
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    networks:
      - netpulse-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  scanner:
    build: ./scanner
    container_name: netpulse-scanner
    restart: always
    mem_limit: 256m
    networks:
      - netpulse-net
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - SCANNER_PORT=${SCANNER_PORT}
      - BACKEND_URL=http://backend:3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DEBUG=${DEBUG}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: netpulse-backend
    restart: always
    mem_limit: 512m
    networks:
      - netpulse-net
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SCANNER_URL: http://scanner:${SCANNER_PORT:-8000}
      CORS_ORIGIN: ${CORS_ORIGIN}
      API_KEY: ${API_KEY:-dev-api-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: netpulse-frontend
    restart: always
    mem_limit: 256m
    environment:
      - VITE_API_URL=http://localhost:3001
    ports:
      - "5173:5173"
    networks:
      - netpulse-net
    depends_on:
      - backend

networks:
  netpulse-net:
    driver: bridge

volumes:
  postgres-data:
