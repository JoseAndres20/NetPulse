name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend: TypeScript + Lint ───────────────────────────────────────────
  backend:
    name: Backend (TypeScript + ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

  # ─── Frontend: TypeScript + Lint ──────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript + ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

  # ─── Scanner: Python lint ─────────────────────────────────────────────────
  scanner:
    name: Scanner (Python / flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install lint tools
        run: pip install flake8 flake8-bugbear

      - name: Lint
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=__pycache__ \
            --extend-ignore=E501,W503

  # ─── Docker: build completo (solo si los 3 jobs anteriores pasan) ──────────
  docker:
    name: Docker (compose validate + build)
    runs-on: ubuntu-latest
    needs: [backend, frontend, scanner]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Build all images
        run: docker compose build --no-cache
